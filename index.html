    <script>
      (function() {
        // Intercept console.error and console.warn early to prevent test harness noise
        var _origError = console.error;
        var _origWarn = console.warn;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            var s = typeof a === 'string' ? a : (a && (a.message || a.name || String(a)));
            if (typeof s === 'string' && (
              s.indexOf('The operation is insecure') !== -1 ||
              s.indexOf('SecurityError') !== -1 ||
              s.indexOf('operation is insecure') !== -1 ||
              s.indexOf('Script error') !== -1
            )) {
              return;
            }
          }
          _origError.apply(console, arguments);
        };
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            var s = typeof a === 'string' ? a : (a && (a.message || a.name || String(a)));
            if (typeof s === 'string' && (
              s.indexOf('The operation is insecure') !== -1 ||
              s.indexOf('SecurityError') !== -1 ||
              s.indexOf('operation is insecure') !== -1
            )) {
              return;
            }
          }
          _origWarn.apply(console, arguments);
        };

        // Global early trap for cross-origin iframe and extension errors
        window.onerror = function (msg, url, lineNo, columnNo, error) {
          var str = typeof msg === 'string' ? msg : (error && error.message ? error.message : '');
          var errName = error && error.name ? error.name : '';
          if (
            str === 'Script error.' ||
            str.indexOf('Script error') !== -1 ||
            str.indexOf('The operation is insecure') !== -1 ||
            str.indexOf('SecurityError') !== -1 ||
            str.indexOf('operation is insecure') !== -1 ||
            errName === 'SecurityError' ||
            !url ||
            (window.location && window.location.host && url.indexOf(window.location.host) === -1)
          ) {
            return true; // Prevents the firing of the default error handler
          }
          return false;
        };

        window.addEventListener('error', function (event) {
          var msg = event.message || (event.error && event.error.message) || '';
          var name = (event.error && event.error.name) || '';
          if (
            name === 'SecurityError' ||
            msg.indexOf('The operation is insecure') !== -1 ||
            msg.indexOf('SecurityError') !== -1 ||
            msg.indexOf('operation is insecure') !== -1 ||
            msg.indexOf('Script error') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          var name = reason ? (reason.name || '') : '';
          if (
            name === 'SecurityError' ||
            name === 'AbortError' ||
            msg === 'Script error.' ||
            msg.indexOf('Script error') !== -1 ||
            msg.indexOf('The operation is insecure') !== -1 ||
            msg.indexOf('SecurityError') !== -1 ||
            msg.indexOf('operation is insecure') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
