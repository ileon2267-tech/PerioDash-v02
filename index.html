<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    
    <!-- Strict Content Security Policy (CSP) - Anti-XSS & Secure Origin Isolation -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://*.firebaseapp.com https://*.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://*.run.app wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://wa.me https://api.twilio.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <link rel="apple-touch-icon" href="/icon.png" />
    <title>PerioDash v15 Pro</title>
    <script>
      // Global early trap for cross-origin iframe and extension errors
      window.onerror = function (msg, url, lineNo, columnNo, error) {
        if (
          msg === 'Script error.' ||
          (typeof msg === 'string' && msg.indexOf('Script error') !== -1) ||
          !url ||
          (window.location && window.location.host && url.indexOf(window.location.host) === -1)
        ) {
          return true; // Prevents the firing of the default error handler
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (event.reason === 'Script error.' ||
            event.reason.message === 'Script error.' ||
            event.reason.name === 'AbortError' ||
            (typeof event.reason.message === 'string' && event.reason.message.indexOf('Script error') !== -1))
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
